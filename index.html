<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wholesailors Giveaways - Win Amazing Prizes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #171717;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        .gradient-gold {
            background: linear-gradient(135deg, #b79956 0%, #6c5530 100%);
        }
        .text-gradient-gold {
            background: linear-gradient(135deg, #b79956, #6c5530);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body class="min-h-screen">

    <!-- Navigation -->
    <nav class="bg-black/50 backdrop-blur-sm border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <div class="flex items-center space-x-3">
                    <img src="https://wholesailors.com/wp-content/uploads/2025/09/Wholesailors-Academy-V2.webp" alt="Wholesailors" class="h-12 w-auto">
                    <span class="text-2xl font-bold text-gradient-gold">Wholesailors Giveaways</span>
                </div>
                <a href="admin.html" class="gradient-gold text-white px-6 py-2 rounded-lg font-semibold hover:opacity-90 transition">
                    Admin Login
                </a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="py-20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center mb-16">
                <h1 class="text-5xl md:text-6xl font-bold text-white mb-6">
                    Enter to Win Amazing Prizes!
                </h1>
                <p class="text-xl text-gray-400 max-w-2xl mx-auto">
                    Exclusive giveaways for Wholesailors Academy members. Join the fun and win big!
                </p>
            </div>

            <!-- Giveaways Grid -->
            <div id="giveawaysGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <!-- Loading State -->
                <div class="col-span-full flex items-center justify-center py-20">
                    <div class="text-center">
                        <div class="animate-spin rounded-full h-16 w-16 border-t-2 border-b-2 border-yellow-500 mx-auto mb-4"></div>
                        <p class="text-gray-400 text-lg">Loading giveaways...</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Entry Modal -->
    <div id="entryModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-zinc-900 rounded-2xl p-8 max-w-md w-full border border-gray-800">
            <h2 id="modalTitle" class="text-3xl font-bold text-white mb-4"></h2>
            <p id="modalDescription" class="text-gray-400 mb-6"></p>

            <div class="space-y-4">
                <div>
                    <label class="block text-gray-400 font-semibold mb-2">Your Name</label>
                    <input
                        type="text"
                        id="nameInput"
                        class="w-full px-4 py-3 bg-zinc-800 border border-gray-700 rounded-lg focus:border-yellow-600 focus:outline-none text-white placeholder-gray-500"
                        placeholder="John Doe"
                    />
                </div>
                <div>
                    <label class="block text-gray-400 font-semibold mb-2">Email Address</label>
                    <input
                        type="email"
                        id="emailInput"
                        class="w-full px-4 py-3 bg-zinc-800 border border-gray-700 rounded-lg focus:border-yellow-600 focus:outline-none text-white placeholder-gray-500"
                        placeholder="your@email.com"
                    />
                </div>
            </div>

            <div id="messageBox" class="hidden mt-4 p-4 rounded-lg"></div>

            <div class="flex space-x-3 mt-6">
                <button
                    onclick="closeModal()"
                    class="flex-1 px-6 py-3 border-2 border-gray-700 text-gray-300 font-semibold rounded-lg hover:bg-gray-800 transition"
                >
                    Cancel
                </button>
                <button
                    id="submitBtn"
                    onclick="submitEntry()"
                    class="flex-1 px-6 py-3 gradient-gold text-white font-semibold rounded-lg hover:opacity-90 transition"
                >
                    Enter Now
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getFirestore, collection, addDoc, getDocs, query, where } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDp81P6uZyg7sl6XR0uAeqh8_BfJB9_Uj4",
            authDomain: "wholesailorsgiveaway.firebaseapp.com",
            projectId: "wholesailorsgiveaway",
            storageBucket: "wholesailorsgiveaway.firebasestorage.app",
            messagingSenderId: "759006729079",
            appId: "1:759006729079:web:78295f492a5ab6f16a8772",
            measurementId: "G-3EV54HKZRS"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentGiveaway = null;
        let allGiveaways = [];

        // Load giveaways
        async function loadGiveaways() {
            const querySnapshot = await getDocs(collection(db, 'giveaways'));
            allGiveaways = querySnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            const giveaways = allGiveaways;

            const grid = document.getElementById('giveawaysGrid');

            if (giveaways.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-20">
                        <p class="text-gray-400 text-xl">No active giveaways at the moment. Check back soon!</p>
                    </div>
                `;
                return;
            }

            // Get entry counts
            const entriesSnapshot = await getDocs(collection(db, 'entries'));
            const entries = entriesSnapshot.docs.map(doc => doc.data());

            grid.innerHTML = giveaways.map(giveaway => {
                const entryCount = entries.filter(e => e.giveawayId === giveaway.id).length;
                const isActive = giveaway.status === 'active';
                const hasWinner = giveaway.status === 'ended' && giveaway.winner;

                return `
                    <div class="bg-zinc-900 rounded-2xl overflow-hidden border border-gray-800 transform hover:scale-105 transition-transform duration-300">
                        <div class="gradient-gold p-8">
                            <svg class="w-12 h-12 text-white mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                            </svg>
                            <h3 class="text-2xl font-bold text-white mb-2">${giveaway.name}</h3>
                            <p class="text-gray-200">${giveaway.description}</p>
                        </div>
                        <div class="p-6">
                            ${giveaway.annualMemberOnly ? `
                                <div class="mb-4 p-3 bg-purple-500/10 border-2 border-purple-500/30 rounded-lg">
                                    <div class="flex items-center space-x-2">
                                        <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path>
                                        </svg>
                                        <span class="text-purple-300 font-bold text-sm">ANNUAL MEMBERS ONLY</span>
                                    </div>
                                    <p class="text-purple-400 text-xs mt-1">This giveaway is exclusive to annual Wholesailors Academy members</p>
                                </div>
                            ` : ''}
                            <div class="flex items-center justify-between mb-4 text-gray-400">
                                <div class="flex items-center space-x-2">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                                    </svg>
                                    <span class="font-semibold">${entryCount} Entries</span>
                                </div>
                                <span class="px-3 py-1 rounded-full text-sm font-semibold ${
                                    isActive ? 'bg-green-500/20 text-green-400' : 'bg-gray-700 text-gray-400'
                                }">
                                    ${isActive ? 'Active' : 'Ended'}
                                </span>
                            </div>
                            ${hasWinner ? `
                                <div class="mb-4 p-4 bg-gradient-to-r from-yellow-600/20 to-yellow-700/20 border border-yellow-600/30 rounded-lg">
                                    <div class="flex items-center space-x-2 mb-2">
                                        <svg class="w-5 h-5 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path>
                                        </svg>
                                        <p class="text-yellow-500 font-bold text-sm">🎉 Winner</p>
                                    </div>
                                    <p class="text-white font-semibold text-lg">${giveaway.winner.name || 'Winner Selected'}</p>
                                </div>
                            ` : ''}
                            <button
                                onclick="window.openEntryModal('${giveaway.id}')"
                                ${!isActive ? 'disabled' : ''}
                                class="w-full gradient-gold text-white font-semibold py-3 rounded-lg hover:opacity-90 transition disabled:opacity-50 disabled:cursor-not-allowed"
                            >
                                ${isActive ? 'Enter Giveaway' : 'Giveaway Ended'}
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Check member status
        async function checkMemberStatus(email) {
            try {
                const response = await fetch('https://lowballoffer.ai/api/check-member', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });

                if (!response.ok) return { success: false, error: response.statusText };
                const data = await response.json();

                // Check if annual member
                const isAnnualMember = data.member && data.member.skool_annual_member === 1;

                return {
                    success: true,
                    isMember: data.isMember === true,
                    isAnnualMember: isAnnualMember,
                    data
                };
            } catch (error) {
                return { success: false, error: error.message };
            }
        }

        // Submit entry
        window.submitEntry = async function() {
            const name = document.getElementById('nameInput').value;
            const email = document.getElementById('emailInput').value;
            const submitBtn = document.getElementById('submitBtn');
            const messageBox = document.getElementById('messageBox');

            if (!name || name.trim().length === 0) {
                showMessage('error', 'Please enter your name.');
                return;
            }

            if (!email || !email.includes('@')) {
                showMessage('error', 'Please enter a valid email address.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';
            messageBox.classList.add('hidden');

            try {
                // Check member status
                const memberCheck = await checkMemberStatus(email);

                if (!memberCheck.success) {
                    showMessage('error', 'Unable to verify membership. Please try again.');
                    return;
                }

                if (!memberCheck.isMember) {
                    showMessage('error', 'You must be a Wholesailors Academy member to enter.');
                    return;
                }

                // Check if this is an annual-only giveaway
                if (currentGiveaway.annualMemberOnly && !memberCheck.isAnnualMember) {
                    showMessage('error', 'This giveaway is only for annual Wholesailors Academy members.');
                    return;
                }

                // Check if already entered
                const q = query(
                    collection(db, 'entries'),
                    where('giveawayId', '==', currentGiveaway.id),
                    where('email', '==', email)
                );
                const existingEntries = await getDocs(q);

                if (!existingEntries.empty) {
                    showMessage('error', 'You have already entered this giveaway!');
                    return;
                }

                // Add entry
                await addDoc(collection(db, 'entries'), {
                    giveawayId: currentGiveaway.id,
                    giveawayName: currentGiveaway.name,
                    name: name.trim(),
                    email: email,
                    timestamp: new Date().toISOString(),
                    memberData: memberCheck.data
                });

                showMessage('success', '🎉 Successfully entered! Good luck!');
                document.getElementById('nameInput').value = '';
                document.getElementById('emailInput').value = '';

                setTimeout(() => {
                    closeModal();
                    loadGiveaways();
                }, 2000);
            } catch (error) {
                console.error('Error:', error);
                showMessage('error', 'An error occurred. Please try again.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Enter Now';
            }
        };

        function showMessage(type, text) {
            const messageBox = document.getElementById('messageBox');
            messageBox.className = `mt-4 p-4 rounded-lg ${
                type === 'success' ? 'bg-green-500/20 text-green-400 border border-green-500/50' : 'bg-red-500/20 text-red-400 border border-red-500/50'
            }`;
            messageBox.textContent = text;
            messageBox.classList.remove('hidden');
        }

        // Open modal
        window.openEntryModal = function(id) {
            const giveaway = allGiveaways.find(g => g.id === id);
            if (!giveaway || giveaway.status !== 'active') return;

            currentGiveaway = {
                id: giveaway.id,
                name: giveaway.name,
                description: giveaway.description,
                annualMemberOnly: giveaway.annualMemberOnly || false
            };
            document.getElementById('modalTitle').textContent = giveaway.name;
            document.getElementById('modalDescription').textContent = giveaway.description;
            document.getElementById('entryModal').classList.remove('hidden');
        };

        // Close modal
        window.closeModal = function() {
            document.getElementById('entryModal').classList.add('hidden');
            document.getElementById('nameInput').value = '';
            document.getElementById('emailInput').value = '';
            document.getElementById('messageBox').classList.add('hidden');
        };

        // Handle enter key
        document.getElementById('nameInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('emailInput').focus();
        });

        document.getElementById('emailInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') window.submitEntry();
        });

        // Load on start
        loadGiveaways();
    </script>
</body>
</html>
